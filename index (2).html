<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberFlow - Sistema de Agendamento</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; padding: 20px; background: #1e293b; color: #fff; border-radius: 8px; }
        header p { color: #94a3b8; margin-top: 5px; }
        main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 650px) { main { grid-template-columns: 1fr; } }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 15px; font-size: 1.2rem; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 0.95rem; }
        .btn-primary { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn-primary:hover { background: #1d4ed8; }
        .feedback { margin-top: 10px; font-size: 0.9rem; font-weight: bold; text-align: center; }
        .sucesso { color: #16a34a; }
        .erro { color: #dc2626; }
        .item-agendamento { border: 1px solid #e2e8f0; padding: 12px; border-radius: 6px; margin-bottom: 10px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
        .btn-cancelar { background: #ef4444; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-cancelar:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✂️ BarberFlow</h1>
            <p>Sistema de Agendamento de Barbearia (Arquitetura MVC)</p>
        </header>

        <main>
            <section class="card">
                <h2>Novo Agendamento</h2>
                <form id="form-agendamento">
                    <div class="form-group">
                        <label for="cliente">Nome do Cliente:</label>
                        <input type="text" id="cliente" placeholder="Ex: João Silva" required>
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone / WhatsApp:</label>
                        <input type="tel" id="telefone" placeholder="Ex: (16) 99999-9999" required>
                    </div>

                    <div class="form-group">
                        <label for="servico">Serviço:</label>
                        <select id="servico" required>
                            <option value="">Selecione um serviço...</option>
                            <option value="Corte de Cabelo - R$ 35,00">Corte de Cabelo - R$ 35,00</option>
                            <option value="Barba Completa - R$ 25,00">Barba Completa - R$ 25,00</option>
                            <option value="Combo Corte + Barba - R$ 55,00">Combo Corte + Barba - R$ 55,00</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dataHora">Data e Horário:</label>
                        <input type="datetime-local" id="dataHora" required>
                    </div>

                    <button type="submit" class="btn-primary">Confirmar Agendamento</button>
                </form>
                <div id="mensagem-feedback" class="feedback"></div>
            </section>

            <section class="card">
                <h2>Agendamentos Confirmados</h2>
                <div id="lista-agendamentos" class="lista">
                    <!-- Os agendamentos aparecerão aqui automaticamente -->
                </div>
            </section>
        </main>
    </div>

    <script>
        class AgendamentoModel {
            constructor() {
                this.chaveStorage = 'barberflow_agendamentos';
            }

            listarTodos() {
                const dados = localStorage.getItem(this.chaveStorage);
                return dados ? JSON.parse(dados) : [];
            }

            salvar(agendamento) {
                if (!agendamento.cliente || !agendamento.telefone || !agendamento.servico || !agendamento.dataHora) {
                    throw new Error("Todos os campos são obrigatórios.");
                }
                const lista = this.listarTodos();
                agendamento.id = Date.now();
                lista.push(agendamento);
                localStorage.setItem(this.chaveStorage, JSON.stringify(lista));
                return agendamento;
            }

            excluir(id) {
                const lista = this.listarTodos().filter(item => item.id !== id);
                localStorage.setItem(this.chaveStorage, JSON.stringify(lista));
            }
        }

        const model = new AgendamentoModel();

        document.addEventListener('DOMContentLoaded', () => {
            atualizarTela();

            const form = document.getElementById('form-agendamento');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const feedback = document.getElementById('mensagem-feedback');

                try {
                    const novoAgendamento = {
                        cliente: document.getElementById('cliente').value.trim(),
                        telefone: document.getElementById('telefone').value.trim(),
                        servico: document.getElementById('servico').value,
                        dataHora: document.getElementById('dataHora').value
                    };

                    model.salvar(novoAgendamento);
                    form.reset();
                    feedback.textContent = "✅ Agendamento realizado com sucesso!";
                    feedback.className = "feedback sucesso";
                    atualizarTela();
                } catch (erro) {
                    feedback.textContent = "❌ Erro: " + erro.message;
                    feedback.className = "feedback erro";
                }
            });
        });

        function atualizarTela() {
            const container = document.getElementById('lista-agendamentos');
            const agendamentos = model.listarTodos();

            if (agendamentos.length === 0) {
                container.innerHTML = "<p style='color:#64748b; font-size:0.9rem;'>Nenhum horário agendado ainda.</p>";
                return;
            }

            container.innerHTML = agendamentos.map(item => {
                const dataFormatada = new Date(item.dataHora).toLocaleString('pt-BR');
                return `
                    <div class="item-agendamento">
                        <div>
                            <strong>${item.cliente}</strong> (${item.telefone})<br>
                            <small>${item.servico}</small><br>
                            <small style="color:#2563eb;">📅 ${dataFormatada}</small>
                        </div>
                        <button class="btn-cancelar" onclick="cancelarAgendamento(${item.id})">Cancelar</button>
                    </div>
                `;
            }).join('');
        }

        function cancelarAgendamento(id) {
            model.excluir(id);
            atualizarTela();
        }
    </script>
</body>
</html>
